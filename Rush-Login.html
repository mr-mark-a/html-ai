<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Rush Key</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d2b48c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Enter Rush Key</h2>
        <input type="password" id="rushKeyInput" placeholder="Enter PIN code">
        <button onclick="verifyKey()">Submit</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        function getStoredTokens() {
            const value = parseFloat(localStorage.getItem('tokens') || '0');
            return Number.isFinite(value) ? value : 0;
        }

        function setStoredTokens(amount) {
            localStorage.setItem('tokens', Number(amount).toFixed(2));
        }

        function awardRushLoginBonus() {
            if (localStorage.getItem('rushLoginBonusAwarded') !== '1') {
                setStoredTokens(getStoredTokens() + 50);
                localStorage.setItem('rushLoginBonusAwarded', '1');
            }
        }

        function verifyKey() {
            const enteredKey = document.getElementById('rushKeyInput').value;
            const savedKey = localStorage.getItem('rushKey');
            const errorMsg = document.getElementById('errorMsg');

            if (!savedKey) {
                errorMsg.textContent = "No Rush Key set up yet! Please use the setup page first.";
                return;
            }

            if (enteredKey === savedKey) {
                awardRushLoginBonus();
                // Redirect to marks-games.html in the same folder
                window.location.href = 'marks-games.html';
            } else {
                localStorage.removeItem('rushKey');
                window.location.href = 'https://elli-ai.my.canva.site/millions-of-tools-all-in-one-place';
            }
        }
    </script>

</body>
</html>
